      "id": "sorting-motivation",
      "kind": "source",
      "passage": "We use *faultization* to mean deliberately disturbing a model's operating assumptions and inspecting what follows. The motivation comes in part from experiments on sorting arrays whose elements act locally and can be damaged [@zhang2025]. Levin's proposed relation between physical systems and mathematical patterns supplies a broader philosophical motivation [@levin2026]. Neither supplies an alternative transition rule for this allocation model. The useful experimental question is which details of the rule account for its successes and failures.",
      "evidence": {
        "citation_id": "zhang2025",
        "locator": "Publisher abstract, distributed sorting/damaged-element descriptions; publication metadata.",
        "verified": true,
        "verification_note": "Checked these primary sections. Final issue February 2025, 33(1):25–54; online-first August 2024. Motivation only, not a claim of word coinage or evidence for the new results."
      }
    },
    {
      "id": "pattern-motivation",
      "kind": "source",
      "passage": "We use *faultization* to mean deliberately disturbing a model's operating assumptions and inspecting what follows. The motivation comes in part from experiments on sorting arrays whose elements act locally and can be damaged [@zhang2025]. Levin's proposed relation between physical systems and mathematical patterns supplies a broader philosophical motivation [@levin2026]. Neither supplies an alternative transition rule for this allocation model. The useful experimental question is which details of the rule account for its successes and failures.",
