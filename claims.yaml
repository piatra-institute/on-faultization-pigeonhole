      "id": "abstract-scope",
      "kind": "interpretation",
      "passage": "An empty resource can look like the best destination precisely because it accepts nothing. We study this failure in a small allocation model: ten items move among seven holes using sampled load reports. The pigeonhole bound constrains fully placed assignments, but the usual overload measure records coverage, not balance, and can improve when items become unplaced. A new audit separates these outcomes, pairs random inputs across conditions, and compares load-seeking rules with random movement, staying put, and an arrival-aware alternative. Across thirty seed tapes, closing five holes leaves a mean of 5.03 items unplaced under the original comparison rule. Sampling every hole does not help; trying another candidate after rejection places every item. Tiny Gaussian errors also depend on the implementation. Truncating noisy loads and leaving them unquantized both worsen allocation, whereas nearest-integer rounding preserves the noiseless result at the smallest tested scale. Accounting for the arriving item prevents that endpoint loss, although movement continues. Finally, blocking entry preserves existing occupancy; eviction creates a different recovery problem. These results identify failures in admission information and local cost comparisons. They support a method for inspecting a perturbation model, with no additional inference about cognition or access to mathematical patterns.",
      "rationale": "Summary of bound results: thirty tapes, ten items/seven holes, five-closure failure, retry success, encoding/arrival controls, and close/evict events. No new evidence of cognition or pattern ontology."
