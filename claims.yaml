    {
      "id": "congestion-accounting",
      "kind": "source",
      "passage": "The original greedy comparison accepts $b<a$. With truthful integer loads, it cannot raise $Q$, but it permits neutral moves when $b=a-1$. Our arrival-aware alternative requires $b+1<a$ and therefore makes only strict improvements under the same conditions. This is a special case of the cost accounting in congestion games, where the arriving player contributes to congestion [@rosenthal1973]. For this unrestricted, identical-resource, linear-load case, an unbalanced allocation always offers an improving move. Larger system size alone does not create suboptimal local minima of this cost.",
      "evidence": {
        "citation_id": "rosenthal1973",
        "locator": "Primary scan, pp.65–67, resource cost definition and equilibrium proof.",
        "verified": true,
        "verification_note": "Read all three pages. Congestion includes the choosing player. The manuscript's global-balance result is separately derived for identical linear-load holes, not attributed to every congestion game."
      }
    },
    {
      "id": "balanced-allocation-context",
      "kind": "source",
