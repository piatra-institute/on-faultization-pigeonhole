abstract: |-
  We apply faultization (a systematic regime of morphogenetic perturbation) to the pigeonhole principle reinterpreted as a distributed multi-agent system, asking which patterns from the latent space (Levin, 2026) the system accesses under irreducible constraint. The theoretical minimum overload O_min = m − n is a mathematical truth the system reaches without computing it. Because overload equals m minus the number of occupied holes when all pigeons are placed, reaching O_min is complete coverage of the usable holes rather than optimal load balancing, and in six of eight experiments every run reaches it with zero variance. Perceptual noise produces immediate degradation with no detectable tolerance down to the smallest noise tested; misleading holes invert the pattern-seeking mechanism, the study's strongest result; and all four local policies reach identical endpoints despite 5-fold differences in process cost. We read the free-lunch framing as Levin's philosophical sense, distinct from the No-Free-Lunch theorem, and separate the empirical results from that interpretation.
